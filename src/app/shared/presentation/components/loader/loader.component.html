@switch (type) {

@case ('monkey') {
<!-- 🐵 MONKEY LOADER - Estilo corporativo -->
<div class="flex flex-col items-center justify-center text-center space-y-8" [style.height]="getLoaderHeight()">
    <div class="relative w-36 h-36 flex items-center justify-center">
        <!-- Anillos concéntricos animados -->
        <div class="absolute w-full h-full">
            <!-- Anillo exterior giratorio -->
            <div
                class="absolute inset-0 border-4 border-transparent border-t-blue-500/60 border-r-blue-400/40 rounded-full animate-spin-slow">
            </div>
            <!-- Anillo interior giratorio en dirección opuesta -->
            <div
                class="absolute inset-6 border-3 border-transparent border-b-blue-600/70 border-l-blue-300/50 rounded-full animate-spin-slow-reverse">
            </div>
            <!-- Anillo medio con efecto de pulso -->
            <div class="absolute inset-12 border-2 border-blue-400/30 rounded-full animate-pulse"></div>
        </div>

        <!-- Brillo de fondo sutil -->
        <div
            class="absolute inset-0 rounded-full bg-linear-to-r from-blue-500/5 to-cyan-400/5 blur-xl animate-pulse duration-3000">
        </div>

        <!-- Contenedor central con efecto 3D -->
        <div class="relative w-32 h-32 flex items-center justify-center">
            <!-- Efecto de profundidad -->
            <div
                class="absolute inset-0 bg-linear-to-br from-blue-100 to-blue-50 dark:from-gray-800 dark:to-gray-900 rounded-2xl shadow-2xl shadow-blue-500/20">
            </div>

            <!-- Borde luminoso animado -->
            <div
                class="absolute -inset-1 bg-linear-to-r from-blue-400 via-cyan-400 to-blue-600 rounded-2xl opacity-70 animate-border-glow blur-sm">
            </div>

            <!-- Logo con efecto de flotación -->
            <div class="relative z-10">
                <img [src]="logo" alt="Monkey Logo" class="w-20 h-20 object-contain animate-float" />

                <!-- Brillo sobre el logo -->
                <div
                    class="absolute -inset-4 bg-linear-to-tr from-transparent via-blue-400/10 to-transparent animate-shine rounded-full">
                </div>
            </div>

            <!-- Puntos orbitales -->
            <div class="absolute -inset-4">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2">
                    <div class="w-3 h-3 bg-blue-400 rounded-full animate-orbit-slow shadow-lg shadow-blue-400/50"></div>
                </div>
                <div class="absolute top-1/2 right-0 translate-x-1/2 -translate-y-1/2">
                    <div class="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-orbit-medium shadow-lg shadow-cyan-400/50">
                    </div>
                </div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2">
                    <div class="w-2 h-2 bg-blue-500 rounded-full animate-orbit-fast shadow-lg shadow-blue-500/50"></div>
                </div>
                <div class="absolute top-1/2 left-0 -translate-x-1/2 -translate-y-1/2">
                    <div
                        class="w-2 h-2 bg-blue-300 rounded-full animate-orbit-medium-delay shadow-lg shadow-blue-300/50">
                    </div>
                </div>
            </div>
        </div>

        <!-- Puntos en las esquinas -->
        <div
            class="absolute -top-2 -left-2 w-3 h-3 bg-linear-to-r from-blue-400 to-cyan-300 rounded-full animate-ping-slow">
        </div>
        <div
            class="absolute -top-2 -right-2 w-3 h-3 bg-linear-to-r from-cyan-400 to-blue-300 rounded-full animate-ping-slow delay-300">
        </div>
        <div
            class="absolute -bottom-2 -left-2 w-3 h-3 bg-linear-to-r from-blue-500 to-cyan-400 rounded-full animate-ping-slow delay-600">
        </div>
        <div
            class="absolute -bottom-2 -right-2 w-3 h-3 bg-linear-to-r from-cyan-500 to-blue-400 rounded-full animate-ping-slow delay-900">
        </div>
    </div>

    <!-- Texto con efecto de onda -->
    <div class="relative">
        <p
            class="dark:text-blue-300 text-xl font-semibold tracking-wide animate-text-wave bg-linear-to-r from-blue-600 to-cyan-500 dark:from-blue-400 dark:to-cyan-300 bg-clip-text text-transparent">
            {{ text }}
        </p>

        <!-- Barra de progreso sutil -->
        <div class="mt-6 w-48 h-1.5 bg-blue-100 dark:bg-blue-900/30 rounded-full overflow-hidden">
            <div class="h-full bg-linear-to-r from-blue-500 to-cyan-400 rounded-full animate-progress-bar"></div>
        </div>
    </div>
</div>
}

@case ('dashboard') {
<!-- 📊 Skeleton estilo Dashboard -->
<div class="flex flex-col justify-center animate-pulse w-full max-w-6xl mx-auto p-6 space-y-6
               h-[calc(100vh-5rem)] overflow-y-auto">
    <!-- Header -->
    <div class="h-8 w-1/3 bg-gray-300 rounded"></div>

    <!-- Filtros -->
    <div class="flex space-x-4">
        <div class="h-10 w-40 bg-gray-300 rounded"></div>
        <div class="h-10 w-40 bg-gray-300 rounded"></div>
        <div class="h-10 w-40 bg-gray-300 rounded"></div>
    </div>

    <!-- Tarjetas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        @for (card of cards; track card) {
        <div class="h-28 bg-gray-300 rounded-xl"></div>
        }
    </div>

    <!-- Gráfica -->
    <div class="h-72 bg-gray-300 rounded-xl"></div>

    <!-- Tabla -->
    <div class="space-y-3">
        @for (row of rows; track row) {
        <div class="h-8 bg-gray-300 rounded"></div>
        }
    </div>
</div>
}

@default {
<!-- ⚙️ Loader por defecto -->
<div class="flex flex-col items-center justify-center min-h-[150px]
               h-[calc(100vh-5rem)]">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="mt-4 text-gray-600 dark:text-gray-300">{{ text }}</p>
</div>
}

}
