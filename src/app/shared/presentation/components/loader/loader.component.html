@switch (type) {

@case ('monkey') {
<!-- Loader corporativo: sobrio, un solo anillo, sin efectos de color -->
<div class="flex flex-col items-center justify-center text-center gap-6" [style.height]="getLoaderHeight()">
    <div class="relative w-24 h-24 flex items-center justify-center">
        <!-- Anillo giratorio, un solo color -->
        <div
            class="absolute inset-0 border-2 border-gray-200 dark:border-gray-700 border-t-primary rounded-full animate-spin-slow">
        </div>

        <!-- Logo centrado -->
        <div class="relative w-14 h-14 flex items-center justify-center rounded-xl bg-white dark:bg-gray-800 shadow-sm">
            <img [src]="logo" alt="Monkey Logo" class="w-9 h-9 object-contain animate-fade-pulse" />
        </div>
    </div>

    <div class="flex flex-col items-center gap-3">
        <p class="text-sm font-medium text-gray-600 dark:text-gray-300 tracking-wide">
            {{ text }}
        </p>

        <!-- Barra de progreso sutil -->
        <div class="w-40 h-1 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
            <div class="h-full w-1/3 bg-primary rounded-full animate-progress-bar"></div>
        </div>
    </div>
</div>
}

@case ('dashboard') {
<!-- 📊 Skeleton estilo Dashboard -->
<div class="flex flex-col justify-center animate-pulse w-full max-w-6xl mx-auto p-6 space-y-6
               h-[calc(100vh-5rem)] overflow-y-auto">
    <!-- Header -->
    <div class="h-8 w-1/3 bg-gray-300 rounded"></div>

    <!-- Filtros -->
    <div class="flex space-x-4">
        <div class="h-10 w-40 bg-gray-300 rounded"></div>
        <div class="h-10 w-40 bg-gray-300 rounded"></div>
        <div class="h-10 w-40 bg-gray-300 rounded"></div>
    </div>

    <!-- Tarjetas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        @for (card of cards; track card) {
        <div class="h-28 bg-gray-300 rounded-xl"></div>
        }
    </div>

    <!-- Gráfica -->
    <div class="h-72 bg-gray-300 rounded-xl"></div>

    <!-- Tabla -->
    <div class="space-y-3">
        @for (row of rows; track row) {
        <div class="h-8 bg-gray-300 rounded"></div>
        }
    </div>
</div>
}

@default {
<!-- ⚙️ Loader por defecto -->
<div class="flex flex-col items-center justify-center min-h-[150px]
               h-[calc(100vh-5rem)]">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="mt-4 text-gray-600 dark:text-gray-300">{{ text }}</p>
</div>
}

}
