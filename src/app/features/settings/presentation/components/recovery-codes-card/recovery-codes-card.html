<section class="mk-surface p-5 md:p-6" data-testid="recovery-codes">
  @if (recoveryCodes().length) {
    <div class="mk-surface-state-warn p-4" role="status">
      <p class="text-base font-semibold text-ink">{{ 'SETTINGS.SECURITY.RECOVERY.SHOWN_ONCE' | translate }}</p>
      <ul class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-5" data-testid="recovery-codes-list">
        @for (item of recoveryCodes(); track item) {
          <li><code class="block rounded-control border border-line bg-surface px-2 py-1.5 text-center text-sm font-bold tracking-wider text-ink">{{ item }}</code></li>
        }
      </ul>
      <div class="mt-3 flex flex-wrap items-center gap-3">
        <button type="button" (click)="copy()" class="mk-btn">
          {{ (copied() ? 'SETTINGS.SECURITY.RECOVERY.COPIED' : 'SETTINGS.SECURITY.RECOVERY.COPY') | translate }}
        </button>
        <label class="flex items-center gap-2 text-sm text-ink">
          <input type="checkbox" [checked]="saved()" (change)="saved.set(!saved())" class="mk-checkbox" />
          {{ 'SETTINGS.SECURITY.RECOVERY.SAVED' | translate }}
        </label>
        <button type="button" (click)="dismiss()" [disabled]="!saved()" class="text-sm font-medium text-ink underline disabled:cursor-not-allowed disabled:text-ink-faint">{{ 'SETTINGS.SECURITY.RECOVERY.CLOSE' | translate }}</button>
      </div>
    </div>
  } @else {
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <p class="max-w-xl text-base text-ink-muted">{{ 'SETTINGS.SECURITY.RECOVERY.IDLE_HELP' | translate }}</p>
      <button type="button" (click)="start()" data-testid="recovery-codes-start"
        class="mk-btn-secondary shrink-0">
        {{ 'SETTINGS.SECURITY.RECOVERY.GENERATE' | translate }}
      </button>
    </div>
  }
</section>

<app-second-factor-dialog [open]="asking()" [loading]="loading()" [errorMessage]="errorMessage()" [allowRecovery]="false"
  [title]="'SETTINGS.SECURITY.RECOVERY.CONFIRM_TITLE' | translate" [description]="'SETTINGS.SECURITY.RECOVERY.CONFIRM_BODY' | translate" [confirmLabel]="'SETTINGS.SECURITY.RECOVERY.CONFIRM' | translate"
  (confirmed)="generate($event)" (cancelled)="cancel()" />
