<div class="mk-enter">
  <app-admin-user-list [rows]="rows()" [page]="pageInfo()" [loading]="loading()" [failed]="failed()" [status]="status()" [sort]="sort()" [currentUserId]="currentUserId()" [resendingId]="resendingId()"
    (pageChange)="load($event)" (statusChange)="onStatus($event)" (sortChange)="onSort($event)" (resend)="onResend($event)" (deactivate)="deactivateError.set(null); deactivating.set($event)"
    (reactivate)="reactivating.set($event)" (retry)="load(pageInfo().page)">
    <button listActions type="button" class="mk-btn" (click)="openInvite()" data-testid="admin-invite-open">{{ 'ADMIN_USERS.INVITE.OPEN' | translate }}</button>
  </app-admin-user-list>
</div>

<!-- Invitar: el código de quien invita va en el mismo formulario (D117). -->
<app-form-modal [open]="inviteOpen()" titleKey="ADMIN_USERS.INVITE.TITLE" descriptionKey="ADMIN_USERS.INVITE.SUBTITLE" size="lg" testId="admin-invite" [dismissible]="!inviting()" [guarded]="inviteDirty()" [busy]="inviting()" (closed)="closeInvite()">
  @if (inviteOpen()) {
    <app-admin-invite-form [busy]="inviting()" [error]="inviteError()" [fieldErrors]="inviteFieldErrors()" (invited)="onInvite($event)" />
  }
  <button actions type="submit" form="admin-invite-form" class="mk-btn" [appBusy]="inviting()" data-testid="admin-invite-submit">{{ 'ADMIN_USERS.INVITE.SUBMIT' | translate }}</button>
</app-form-modal>

<!-- Invitar: con el formulario completo, el diálogo reutilizable pide el código del segundo factor -->
<app-second-factor-dialog [open]="!!pendingInvite()" [allowRecovery]="false" [loading]="inviting()" [errorMessage]="inviteCodeError()"
  [title]="'ADMIN_USERS.INVITE.CONFIRM_TITLE' | translate"
  [description]="'ADMIN_USERS.INVITE.CONFIRM_DESCRIPTION' | translate: { email: pendingInvite()?.email ?? '' }"
  [confirmLabel]="'ADMIN_USERS.INVITE.CONFIRM_SUBMIT' | translate" (confirmed)="onInviteConfirmed($event)" (cancelled)="pendingInvite.set(null)" />

<!-- Estado del envío de la invitación (nunca el código): «Listo» lo cierra; si el correo no salió, reenviarlo es la acción principal. -->
<app-form-modal [open]="!!invited()" size="md" [titleKey]="inviteFailed() ? 'ADMIN_USERS.RESULT.FAILED_TITLE' : 'ADMIN_USERS.RESULT.SENT_TITLE'" testId="admin-invite-result-modal"
  cancelLabelKey="ADMIN_USERS.RESULT.DONE" [dismissible]="!resendingInvited()" (closed)="closeInviteResult()">
  @if (invited(); as admin) {
    <app-admin-invite-result [admin]="admin" />
  }
  @if (inviteFailed()) {
    <button actions type="button" class="mk-btn" [appBusy]="resendingInvited()" (click)="onResendFromResult()" data-testid="admin-invite-resend">{{ 'ADMIN_USERS.RESULT.RESEND' | translate }}</button>
  }
</app-form-modal>

<!-- Desactivar: el aviso de las consecuencias va en la descripción, junto al campo del código -->
<app-second-factor-dialog [open]="!!deactivating()" [danger]="true" [allowRecovery]="false" [loading]="deactivateSending()" [errorMessage]="deactivateError()"
  [title]="'ADMIN_USERS.DEACTIVATE.TITLE' | translate: { name: deactivatingName() }"
  [description]="'ADMIN_USERS.DEACTIVATE.DESCRIPTION' | translate: { email: deactivating()?.email ?? '' }"
  [confirmLabel]="'ADMIN_USERS.DEACTIVATE.SUBMIT' | translate" (confirmed)="onDeactivateConfirmed($event)" (cancelled)="deactivating.set(null)" />

<!-- Reactivar: confirmación simple, sin código -->
@if (reactivating(); as admin) {
  <app-confirm-dialog titleKey="ADMIN_USERS.REACTIVATE.TITLE" [titleParams]="{ name: nameOf(admin) }" messageKey="ADMIN_USERS.REACTIVATE.MESSAGE" [messageParams]="{ email: admin.email }"
    confirmLabelKey="ADMIN_USERS.REACTIVATE.SUBMIT" [busy]="reactivateSending()" (confirmed)="onReactivateConfirmed()" (cancelled)="reactivating.set(null)" />
}
