<app-data-table [captionKey]="captionKey()" [columns]="tableColumns()" [rows]="rows()" [rowKey]="rowKey" [page]="pageInfo()" [pageSizes]="[]"
  [clickable]="clickable()" [rowLabel]="rowLabel" emptyIcon="" (pageChange)="pageChange.emit($event)" (rowClick)="rowClick.emit($event)">
  <ng-template appCell="code" let-row><app-tag [text]="codeOf(row)" /></ng-template>
  <ng-template appCell="is_active" let-row>
    <app-status-indicator [tone]="statusTone(row)" [labelKey]="statusKey(row)" />
  </ng-template>
</app-data-table>
