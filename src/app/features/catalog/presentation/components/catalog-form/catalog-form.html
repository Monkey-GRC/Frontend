<app-side-drawer [open]="true" [titleKey]="'CATALOG_MODULE.FORM.' + (mode() === 'create' ? 'CREATE' : 'EDIT') + '.' + kind().toUpperCase()" size="lg"
  [dismissible]="!sending" [guarded]="changed" (closed)="cancelled.emit()">

  <form id="catalog-form" class="flex flex-col gap-4" data-form (submit)="$event.preventDefault(); save()" novalidate>
    @if (banner) {
    <div class="mk-surface-state-bad p-3 text-sm text-ink" role="alert" data-banner>
      <span>{{ banner }}</span>
    </div>
    }

    @for (f of mainFields; track f.key) {
    <label [attr.for]="'catalog-field-' + f.key" class="flex flex-col gap-1 text-sm font-medium text-ink">
      <span>{{ 'CATALOG_MODULE.FORM.FIELD.' + f.key.toUpperCase() | translate }}@if (f.required) { <span class="text-bad-ink" aria-hidden="true">*</span> }</span>
      @switch (f.control) {
      @case ('textarea') {
      <textarea rows="4" [id]="'catalog-field-' + f.key" [attr.data-field]="f.key" [value]="values[f.key]" (input)="set(f.key, targetValue($event))" [disabled]="sending"
        class="mk-input !h-auto py-2 font-normal aria-invalid:border-bad" [attr.aria-invalid]="errors[f.key] ? 'true' : null"></textarea>
      }
      @case ('lines') {
      <textarea rows="4" [id]="'catalog-field-' + f.key" [attr.data-field]="f.key" [value]="values[f.key]" (input)="set(f.key, targetValue($event))" [disabled]="sending" [placeholder]="'CATALOG_MODULE.FORM.LINES_HINT' | translate"
        class="mk-input !h-auto py-2 font-normal aria-invalid:border-bad" [attr.aria-invalid]="errors[f.key] ? 'true' : null"></textarea>
      }
      @case ('select') {
      <select [id]="'catalog-field-' + f.key" [attr.data-field]="f.key" (change)="set(f.key, targetValue($event))" [disabled]="sending"
        class="mk-input font-normal aria-invalid:border-bad" [attr.aria-invalid]="errors[f.key] ? 'true' : null">
        @if (!f.initial) { <option value="" [selected]="!values[f.key]">{{ 'CATALOG_MODULE.FORM.CHOOSE' | translate }}</option> }
        @for (o of optionsOf(f); track o.value) {
        <option [value]="o.value" [selected]="values[f.key] === o.value">{{ o.label }}</option>
        }
      </select>
      }
      @default {
      <input type="text" [id]="'catalog-field-' + f.key" [attr.data-field]="f.key" [value]="values[f.key]" (input)="set(f.key, targetValue($event))" [disabled]="sending"
        [placeholder]="(f.key === 'code' && !f.required ? 'CATALOG_MODULE.FORM.CODE_AUTO' : '') | translate"
        class="mk-input font-normal aria-invalid:border-bad" [attr.aria-invalid]="errors[f.key] ? 'true' : null" />
      }
      }
      @if (errors[f.key]) { <span class="text-xs font-normal text-bad-ink" [attr.data-error]="f.key">{{ errors[f.key] }}</span> }
    </label>
    }

    @if (committeeFields.length) {
    <section class="border-t border-line pt-3">
      <button type="button" (click)="committeeOpen = !committeeOpen" [attr.aria-expanded]="committeeOpen" data-committee-toggle
        class="flex w-full items-center justify-between text-left text-sm font-semibold text-ink">
        {{ 'CATALOG_MODULE.FORM.COMMITTEE' | translate }}
        <span class="material-symbols-rounded text-ink-muted" aria-hidden="true">{{ committeeOpen ? 'expand_less' : 'expand_more' }}</span>
      </button>
      <p class="mt-1 text-xs text-ink-muted">{{ 'CATALOG_MODULE.FORM.COMMITTEE_HINT' | translate }}</p>
      @if (committeeOpen) {
      <div class="mt-3 flex flex-col gap-4">
        @for (f of committeeFields; track f.key) {
        <label [attr.for]="'catalog-field-' + f.key" class="flex flex-col gap-1 text-sm font-medium text-ink">
          {{ 'CATALOG_MODULE.TEST_FIELD.' + f.key.toUpperCase() | translate }}
          @if (f.control === 'text') {
          <input type="text" [id]="'catalog-field-' + f.key" [attr.data-field]="f.key" [value]="values[f.key]" (input)="set(f.key, targetValue($event))" [disabled]="sending"
            class="mk-input font-normal aria-invalid:border-bad" [attr.aria-invalid]="errors[f.key] ? 'true' : null" />
          } @else {
          <textarea rows="3" [id]="'catalog-field-' + f.key" [attr.data-field]="f.key" [value]="values[f.key]" (input)="set(f.key, targetValue($event))" [disabled]="sending"
            [placeholder]="f.control === 'lines' ? ('CATALOG_MODULE.FORM.LINES_HINT' | translate) : ''"
            class="mk-input !h-auto py-2 font-normal aria-invalid:border-bad" [attr.aria-invalid]="errors[f.key] ? 'true' : null"></textarea>
          }
          @if (errors[f.key]) { <span class="text-xs font-normal text-bad-ink" [attr.data-error]="f.key">{{ errors[f.key] }}</span> }
        </label>
        }
      </div>
      }
    </section>
    }
  </form>

  <button actions type="button" (click)="cancelled.emit()" [disabled]="sending" class="mk-btn-secondary">{{ 'CATALOG_MODULE.FORM.CANCEL' | translate }}</button>
  <button actions type="submit" form="catalog-form" data-save [disabled]="sending || (mode() === 'edit' && !changed)" class="mk-btn">
    {{ (mode() === 'create' ? 'CATALOG_MODULE.FORM.CREATE_SUBMIT' : 'CATALOG_MODULE.FORM.SAVE') | translate }}
  </button>
</app-side-drawer>
