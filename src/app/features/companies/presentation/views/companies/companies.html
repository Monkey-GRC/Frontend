<div class="mk-enter">
  <app-company-list [loading]="isLoading" [resendingId]="resendingId" (pageChange)="readCompanies($event)" (filterChange)="onFilterChange($event)" (archive)="archiving = $event" (reactivate)="reactivating = $event" (resendKey)="onResendKey($event)" (changeQuota)="onOpenQuota($event)">
    <!-- El botón va en la fila del título de la lista: ya no hay un encabezado aparte que repita lo mismo -->
    <button listActions type="button" class="mk-btn" (click)="onOpenForm()">{{ 'COMPANIES_MODULE.HEADER.BTN-CREATE' | translate }}</button>
  </app-company-list>
</div>

<!-- Registro: los 3 campos del comité y el marco que se contrata (D47). Esc y el clic fuera no cierran con datos sin enviar ni mientras envía; Cancelar sí (salvo mientras envía). -->
<app-form-modal [open]="isFormVisible" size="xl" titleKey="COMPANIES_MODULE.FORM.TITLE" descriptionKey="COMPANIES_MODULE.FORM.SUBTITLE" testId="company-form"
  cancelLabelKey="COMPANIES_MODULE.FORM.CANCEL" [dismissible]="!(companyForm?.sendingForm ?? false)" [guarded]="companyForm?.dirty ?? false" [busy]="companyForm?.sendingForm ?? false"
  (closed)="onCloseForm()">
  <app-company-form (registered)="onRegistered($event)" />
  <button actions type="button" class="mk-btn" [appBusy]="companyForm?.sendingForm ?? false" (click)="companyForm?.onSubmit()" data-testid="company-form-submit">{{ 'COMPANIES_MODULE.FORM.SUBMIT' | translate }}</button>
</app-form-modal>

<!-- D99 · Aviso de que la clave salió por correo (o de que no salió). Solo un mensaje: «Entendido» lo cierra; si no salió, reenviar es la acción principal. -->
<app-form-modal [open]="!!registered" size="md" [titleKey]="keyFailed ? 'COMPANIES_MODULE.KEY.FAILED_TITLE' : 'COMPANIES_MODULE.KEY.TITLE'" testId="company-key"
  cancelLabelKey="COMPANIES_MODULE.KEY.DONE" [dismissible]="!resendingKey" (closed)="onCloseKey()">
  @if (registered) {
  <app-access-key-sent [company]="registered" />
  }
  @if (keyFailed) {
  <button actions type="button" class="mk-btn" [appBusy]="resendingKey" (click)="onResendFromSummary()" data-testid="key-resend">{{ 'COMPANIES_MODULE.KEY.RESEND' | translate }}</button>
  }
</app-form-modal>

<!-- D103 · Cambiar el cupo de usuarios de una empresa -->
<app-form-modal [open]="!!changingQuota" size="lg" titleKey="COMPANIES_MODULE.QUOTA.TITLE" descriptionKey="COMPANIES_MODULE.QUOTA.SUBTITLE" testId="company-quota"
  cancelLabelKey="COMPANIES_MODULE.ARCHIVE.CANCEL" [dismissible]="!quotaSending" [guarded]="quotaForm?.dirty ?? false" [busy]="quotaSending" (closed)="onCloseQuota()">
  <app-company-quota-form [company]="changingQuota" [error]="quotaError" (approved)="onQuotaApproved($event)" />
  <button actions type="button" class="mk-btn" [disabled]="!(quotaForm?.canSubmit ?? false)" [appBusy]="quotaSending" (click)="quotaForm?.onSubmit()" data-testid="company-quota-submit">{{ 'COMPANIES_MODULE.QUOTA.SUBMIT' | translate }}</button>
</app-form-modal>

<!-- D97 · Archivar: aprobar el formulario no lo envía; después se pide el código de seguridad. El botón se habilita al escribir la razón social exacta y completar el resto -->
<app-form-modal [open]="!!archiving" size="lg" titleKey="COMPANIES_MODULE.ARCHIVE.TITLE" descriptionKey="COMPANIES_MODULE.ARCHIVE.SUBTITLE" testId="company-archive"
  cancelLabelKey="COMPANIES_MODULE.ARCHIVE.CANCEL" [guarded]="archiveForm?.dirty ?? false" (closed)="archiving = null">
  <app-company-archive-form [company]="archiving" (approved)="onArchiveApproved($event)" />
  <button actions type="button" class="mk-btn-danger" [disabled]="!(archiveForm?.canSubmit ?? false)" (click)="archiveForm?.onSubmit()" data-testid="company-archive-submit">{{ 'COMPANIES_MODULE.ARCHIVE.SUBMIT' | translate }}</button>
</app-form-modal>

<!-- D97 · Reactivar: solo dentro del plazo -->
<app-form-modal [open]="!!reactivating" size="lg" titleKey="COMPANIES_MODULE.REACTIVATE.TITLE" descriptionKey="COMPANIES_MODULE.REACTIVATE.SUBTITLE" testId="company-reactivate"
  cancelLabelKey="COMPANIES_MODULE.ARCHIVE.CANCEL" [guarded]="reactivateForm?.dirty ?? false" (closed)="reactivating = null">
  <app-company-reactivate-form [company]="reactivating" (approved)="onReactivateApproved($event)" />
  <button actions type="button" class="mk-btn" [disabled]="!(reactivateForm?.canSubmit ?? false)" (click)="reactivateForm?.onSubmit()" data-testid="company-reactivate-submit">{{ 'COMPANIES_MODULE.REACTIVATE.SUBMIT' | translate }}</button>
</app-form-modal>

<!-- Segunda confirmación (D94, D97): el código de la app de autenticación de quien actúa, ya aprobada la acción. Es el modal genérico de verificación del segundo factor: el mismo
     que usan las demás pantallas. Archivar es una acción grave (botón rojo); el código de recuperación no sirve aquí. -->
<app-second-factor-dialog [open]="!!stepUp" [danger]="stepUp?.kind === 'archive'" [allowRecovery]="false" [loading]="stepUpSending" [errorMessage]="stepUpError"
  [title]="'STEP_UP.TITLE' | translate" [description]="'STEP_UP.SUBTITLE' | translate"
  [confirmLabel]="(stepUp?.kind === 'archive' ? 'STEP_UP.SUBMIT_ARCHIVE' : 'STEP_UP.SUBMIT_REACTIVATE') | translate"
  (confirmed)="onStepUpConfirmed($event)" (cancelled)="closeStepUp()" />
