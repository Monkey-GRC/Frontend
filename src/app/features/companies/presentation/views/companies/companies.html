@if (isLoading) {
<app-loader [type]="'monkey'" [headerSize]="'9rem'" />
} @else {
<div class="transition-colors duration-200 animation">
  <div class="max-w-full mx-auto space-y-4 p-4">
    <!-- ================= CONTENT ================= -->
    <div class="flex flex-col">
      <app-company-list (pageChange)="readCompanies($event)">
        <!-- El botón va en la fila del título de la lista: ya no hay un encabezado aparte que repita lo mismo -->
        <button listActions
          class="mk-hero-btn-solid"
          (click)="onOpenForm()">
          <span class="material-symbols-outlined text-base">domain_add</span>
          {{ 'COMPANIES_MODULE.HEADER.BTN-CREATE' | translate }}
        </button>
      </app-company-list>
    </div>
  </div>
</div>
}

<!-- Registro: los 3 campos del comité y el marco que se contrata (D47) -->
<app-dialog [width]="'600px'" [title]="'COMPANIES_MODULE.FORM.TITLE' | translate"
  [subtitle]="'COMPANIES_MODULE.FORM.SUBTITLE' | translate" [isModal]="true"
  [submitText]="'COMPANIES_MODULE.FORM.SUBMIT' | translate" [cancelText]="'COMPANIES_MODULE.FORM.CANCEL' | translate"
  [isSubmitting]="companyForm?.sendingForm ?? false" [visible]="isFormVisible" (onClose)="onCloseForm()"
  (onSubmit)="companyForm?.onSubmit()">
  <app-company-form (registered)="onRegistered($event)" />
</app-dialog>

<!-- Clave de acceso: se muestra una sola vez -->
<app-dialog [width]="'600px'" [title]="'COMPANIES_MODULE.KEY.TITLE' | translate" icon="key" [isModal]="true"
  [allowDragging]="false" [submitText]="'COMPANIES_MODULE.KEY.DONE' | translate"
  [cancelText]="'COMPANIES_MODULE.KEY.CLOSE' | translate" [visible]="!!registered" (onClose)="onCloseKey()"
  (onSubmit)="onCloseKey()">
  @if (registered) {
  <app-access-key-reveal [company]="registered" />
  }
</app-dialog>
