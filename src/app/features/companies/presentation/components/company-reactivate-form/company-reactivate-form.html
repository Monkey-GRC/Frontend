@if (company(); as c) {
<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="flex flex-col gap-4">
    <div class="mk-surface-tinted p-3 text-sm text-ink" role="note">
      {{ 'COMPANIES_MODULE.REACTIVATE.INFO' | translate: { name: c.name, date: (c.archive_until | date: 'dd/MM/yyyy') } }}
    </div>

    <div class="flex flex-col gap-1">
      <label for="reactivate-reason">{{ 'COMPANIES_MODULE.REACTIVATE.REASON_LABEL' | translate }} <span class="text-bad-ink">*</span></label>
      <textarea id="reactivate-reason" rows="2" maxlength="500" formControlName="reason" class="mk-input !h-auto py-2"></textarea>
      <p class="text-xs text-ink-muted">{{ 'COMPANIES_MODULE.ARCHIVE.REASON_HINT' | translate }}</p>
    </div>
  </div>
</form>
}
