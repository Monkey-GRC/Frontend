@if (isLoading) {
<app-loader [type]="'monkey'" [headerSize]="'9rem'" />
} @else {
<div class="transition-colors duration-200 animation">
  <div class="max-w-full mx-auto space-y-4 p-4">
    <!-- ================= CONTENT ================= -->
    <div class="flex flex-col">
      <app-user-list
        (refreshUsers)="readAllUsers()"
        (openModalEmit)="onOpenModal('update', $event)"
      >
        <button listActions
          class="mk-hero-btn-solid"
          (click)="onOpenModal('create')"
        >
          <span class="material-symbols-outlined text-base">add</span>
          {{ 'USERS_MODULE.HEADER.BTN-CREATE' | translate }}
        </button>
      </app-user-list>
    </div>
  </div>

  <app-dialog
    class="hidden"
    [width]="'700px'"
    [title]="title"
    [subtitle]="subtile!"
    [isModal]="true"
    [submitText]="submitText"
    [visible]="isVisible"
    (onClose)="onCloseModal()"
    (onSubmit)="userForm.onSubmit()"
  >
    <app-user-form (sendedForm)="onSubmitForm()" />
  </app-dialog>
</div>
}
