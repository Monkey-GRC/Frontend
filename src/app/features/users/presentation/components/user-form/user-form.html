<form [formGroup]="userService.form">
  <div class="flex flex-col gap-3">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="flex flex-col gap-1">
        <label>Nombre</label>
        <ejs-textbox placeholder="Nombre" formControlName="name" floatLabelType="Never"
          cssClass="e-outline shadow-input"></ejs-textbox>
      </div>
      <div class="flex flex-col gap-1">
        <label>Apellido</label>
        <ejs-textbox placeholder="Apellido" formControlName="last_name" floatLabelType="Never"
          cssClass="e-outline shadow-input"></ejs-textbox>
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label>Correo electrónico <span class="text-red-500">*</span></label>
      <ejs-textbox placeholder="correo@monkey360.com" formControlName="email" floatLabelType="Never"
        cssClass="e-outline shadow-input"></ejs-textbox>
    </div>

    <div class="flex flex-col gap-1">
      <label>Usuario <span class="text-red-500">*</span></label>
      <ejs-textbox placeholder="Nombre de usuario" formControlName="username" floatLabelType="Never"
        cssClass="e-outline shadow-input"></ejs-textbox>
    </div>

    <div class="flex flex-col gap-1">
      <label>
        Contraseña
        @if (action === 'create') {
        <span class="text-red-500">*</span>
        }
      </label>
      <ejs-textbox type="password" [placeholder]="action === 'create' ? 'Mínimo 8 caracteres' : 'Dejar en blanco para no cambiarla'"
        formControlName="password" floatLabelType="Never" cssClass="e-outline shadow-input"></ejs-textbox>
    </div>

    <div class="flex flex-col gap-1">
      <label>Rol <span class="text-red-500">*</span></label>
      <select formControlName="role" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600
            bg-white dark:bg-gray-800 text-gray-900 dark:text-white
            focus:outline-none focus:ring-2 focus:ring-primary-500
            transition-colors duration-200">
        <option value="MONKEY_ADMIN">Monkey Admin</option>
        <option value="USER">Usuario</option>
        <option value="VIEWER">Visualizador</option>
        <option value="CLIENT_ADMIN" disabled>Admin de cliente (próximamente)</option>
      </select>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
        La creación de administradores de cliente estará disponible cuando exista el módulo de tenants.
      </p>
    </div>

    @if (isClientAdmin) {
    <div class="flex flex-col gap-1">
      <label>Cliente (tenant) <span class="text-red-500">*</span></label>
      <ejs-textbox placeholder="uuid del tenant" formControlName="client_id" floatLabelType="Never"
        cssClass="e-outline shadow-input"></ejs-textbox>
    </div>
    }
  </div>
</form>
