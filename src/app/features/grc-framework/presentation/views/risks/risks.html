@if (isLoading) {
    <app-loader [type]="'monkey'" [headerSize]="'9rem'"/>
} @else {
    <div class="transition-colors duration-200 animation">
        <div class="max-w-full mx-auto space-y-6 p-4">

            <!-- ================= HEADER ================= -->
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div class="space-y-1">
                    <h1 class="text-2xl sm:text-3xl font-semibold text-gray-900 dark:text-white">
                        {{ 'RISK.HEADER.TITLE' | translate }}
                    </h1>
                    <p class="text-sm text-gray-600 dark:text-gray-300 max-w-xl">
                        {{ 'RISK.HEADER.SUBTITLE' | translate }}
                    </p>
                </div>

                <button class="inline-flex items-center justify-center gap-2 rounded-lg
                   bg-primary px-4 py-2.5 text-sm font-medium text-white
                   hover:bg-primary-500 dark:hover:bg-primary-600 transition-all duration-200
                   w-full sm:w-auto shadow-sm hover:shadow-md" (click)="onOpenModal('create')">
                    <span class="material-symbols-outlined text-base">add</span>
                    {{ 'RISK.HEADER.BTN-CREATE' | translate }}
                </button>
            </div>

            <!-- ================= KPIs ================= -->
            <app-risk-kpis [risks]="riskService.risks" />

            <!-- ================= CONTENT ================= -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

                <!-- ========== MATRIZ DE RIESGOS ========== -->
                <div class="glass-card dark:glass-card-dark p-5 sm:p-6">
                    <app-risk-matriz />
                </div>

                <!-- ========== REGISTRO DE RIESGOS ========== -->
                <div class="glass-card dark:glass-card-dark p-5 sm:p-6 xl:col-span-2 flex flex-col">
                    <app-risk-list (refreshRisk)="readAllRisk()" (openModalEmit)="onOpenModal('update', $event)"/>
                </div>
            </div>

        </div>

        <app-dialog class="hidden" [width]="'700px'" [title]="title" [subtitle]="subtile!" [isModal]="true" [submitText]="submitText" [visible]="isVisible" (onClose)="onCloseModal()" (onSubmit)="riskForm.onSubmit()">
            <app-risk-form (sendedForm)="onSubmitForm()"/>
        </app-dialog>

    </div>
}
