<form [formGroup]="riskService.form">
    <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-1 w-full">
            <label for="name">Nombre del riesgo <span class="text-red-500">*</span></label>
            <ejs-textbox placeholder="Nombre del riesgo" formControlName="name" floatLabelType="Never"
                cssClass="e-outline shadow-input"></ejs-textbox>
        </div>
        <div class="flex flex-col gap-1">
            <label for="description">Descripción del riesgo <span class="text-red-500">*</span></label>
            <ejs-textarea placeholder="Descripción del tablero" formControlName="description" floatLabelType="Never"
                cssClass="e-outline shadow-input"></ejs-textarea>
        </div>
        <div class="flex flex-row gap-3 w-full">
            <div class="flex flex-col gap-1 w-full">
                <label for="description">Impacto del riesgo <span class="text-red-500">*</span></label>
                <ejs-numerictextbox [format]="'n0'" [min]="1" [max]="5" [showSpinButton]="false" placeholder="Impacto del riesgo" formControlName="impact"
                    floatLabelType="Never" cssClass="e-outline shadow-input w-full"></ejs-numerictextbox>
            </div>
            <div class="flex flex-col gap-1 w-full">
                <label for="description">Probabilidad de aparición del riesgo <span
                        class="text-red-500">*</span></label>
                <ejs-numerictextbox [showSpinButton]="false" [format]="'n0'" [min]="1" [max]="5"
                    placeholder="Probabilidad de aparición del riesgo" formControlName="probability"
                    floatLabelType="Never" cssClass="e-outline shadow-input w-full"></ejs-numerictextbox>
            </div>
        </div>
        <div class="mt-2 p-3 bg-gray-50 dark:bg-gray-800/30 rounded-lg border border-gray-200 dark:border-gray-700">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-gray-900 dark:text-gray-100">Puntuación del riesgo:</span>
                    <span
                        class="px-2 py-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md text-sm font-semibold text-gray-900 dark:text-gray-100 min-w-10 text-center">
                        {{ calculateRiskScore() }}
                    </span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-600 dark:text-gray-400">Nivel:</span>
                    <span class="px-2 py-1 rounded-md text-xs font-semibold" [ngClass]="{
                            'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300': getRiskLevel() === 'Bajo',
                            'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-300': getRiskLevel() === 'Medio',
                            'bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-300': getRiskLevel() === 'Alto',
                            'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300': getRiskLevel() === 'Crítico'
                        }">
                        {{ getRiskLevel() }}
                    </span>
                </div>
            </div>

            <!-- Barra de progreso simple -->
            <div class="space-y-1">
                <div class="h-2 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                    <div class="h-full transition-all duration-300" [ngClass]="{
                            'bg-green-500 dark:bg-green-600': getRiskLevel() === 'Bajo',
                            'bg-yellow-500 dark:bg-yellow-600': getRiskLevel() === 'Medio',
                            'bg-orange-500 dark:bg-orange-600': getRiskLevel() === 'Alto',
                            'bg-red-500 dark:bg-red-600': getRiskLevel() === 'Crítico'
                        }" [style.width.%]="calculateRiskPercentage()">
                    </div>
                </div>
                <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400">
                    <span>0</span>
                    <span>5</span>
                    <span>10</span>
                </div>
            </div>
        </div>
    </div>
</form>
