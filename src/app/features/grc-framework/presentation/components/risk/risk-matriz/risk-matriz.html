<div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Matriz de Riesgos</h3>
    <span class="material-symbols-outlined text-gray-400 dark:text-gray-500">grid_view</span>
</div>

<!-- Matriz 5x5 -->
<div class="grid grid-cols-5 gap-1.5 sm:gap-2 max-w-xs mx-auto sm:max-w-none">
    @for (cell of riskMatrix; track $index) {
    <div class="relative aspect-square rounded-lg flex items-center justify-center
                     {{ cell.color }} dark:{{ cell.darkColor || cell.color }}
                     text-white font-semibold shadow-inner dark:shadow-gray-900/30
                     border border-white/20 dark:border-gray-800/30">

        @if (cell.count) {
        <span class="absolute w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center
                         rounded-full bg-white dark:bg-gray-800
                         text-gray-800 dark:text-gray-200 text-sm font-bold
                         shadow-sm dark:shadow-gray-900">
            {{ cell.count }}
        </span>
        }

    </div>
    }
</div>

<!-- Ejes y Leyenda -->
<div class="mt-6 space-y-4">
    <!-- Ejes -->
    <div class="grid grid-cols-2 gap-4 text-xs text-gray-600 dark:text-gray-400">
        <div class="text-center">
            <span class="font-medium">Impacto</span>
            <div class="flex justify-between mt-1">
                <span>Bajo</span>
                <span>Alto</span>
            </div>
        </div>
        <div class="text-center">
            <span class="font-medium">Probabilidad</span>
            <div class="flex justify-between mt-1">
                <span>Baja</span>
                <span>Alta</span>
            </div>
        </div>
    </div>

    <!-- Leyenda -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded bg-red-500 dark:bg-red-600"></span>
            <span class="text-gray-700 dark:text-gray-300">Crítico</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded bg-orange-500 dark:bg-orange-600"></span>
            <span class="text-gray-700 dark:text-gray-300">Alto</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded bg-yellow-500 dark:bg-yellow-600"></span>
            <span class="text-gray-700 dark:text-gray-300">Medio</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded bg-green-500 dark:bg-green-600"></span>
            <span class="text-gray-700 dark:text-gray-300">Bajo</span>
        </div>
    </div>
</div>
