<div class="flex flex-col gap-3 border border-gray-200 dark:border-gray-700 rounded-lg p-3">
    <div class="flex flex-col gap-1">
        <label>Sistema operativo <span class="text-red-500">*</span></label>
        <select [value]="controlService.form.get('os')?.value ?? ''" (change)="onOsSelect($event)" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600
            bg-white dark:bg-gray-800 text-gray-900 dark:text-white
            focus:outline-none focus:ring-2 focus:ring-primary-500
            transition-colors duration-200">
            <option value="">Selecciona un sistema operativo</option>
            <option value="UBUNTU">Ubuntu</option>
            <option value="WINDOWS">Windows</option>
        </select>
    </div>

    @if (controlService.form.get('os')?.value) {
    <div class="flex flex-col gap-1">
        <div class="flex items-center justify-between gap-2">
            <label>Checks CIS ({{ selectedChecks.length }} seleccionados)</label>
            <button type="button" (click)="openLegend()" title="Referencia de indicadores"
                class="text-blue-500 hover:text-blue-600 dark:text-blue-400 dark:hover:text-blue-300 transition-colors duration-150">
                <span class="material-symbols-outlined text-lg!">info</span>
            </button>
        </div>
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2
                text-gray-400 dark:text-gray-500 text-sm">search</span>
            <input type="text" [value]="searchTerm" (input)="onSearchInput($event)" placeholder="Buscar check..."
                class="w-full pl-10 pr-4 py-2 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                text-gray-900 dark:text-white focus:outline-none focus:ring-2
                focus:ring-primary-500 dark:focus:ring-primary-400 focus:border-transparent
                placeholder:text-gray-400 dark:placeholder:text-gray-500 transition-colors duration-200" />
        </div>

        @if (loading) {
        <p class="text-sm text-gray-500 dark:text-gray-400 py-2">Cargando checks...</p>
        } @else {
        <div class="flex flex-col gap-1 max-h-64 overflow-y-auto pr-1
            scrollbar-thin scrollbar-thumb-gray-300 dark:scrollbar-thumb-gray-700 scrollbar-track-transparent">
            @for (check of filteredChecks; track check.checkId) {
            <label class="flex items-start gap-2 px-2 py-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700/50
                cursor-pointer text-sm text-gray-700 dark:text-gray-200" [title]="check.rationale ?? ''">
                <input type="checkbox" [checked]="isChecked(check)" (change)="toggleCheck(check)" class="mt-0.5" />
                <span class="flex flex-col gap-1">
                    <span>{{ check.title }}</span>
                    @if (check.soc2Code || check.cisCode || check.pciDssCode) {
                    <span class="flex flex-wrap gap-1">
                        @if (check.soc2Code) {
                        <span class="tag-badge text-[11px]
                            bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300">
                            SOC 2 · {{ check.soc2Code }}
                        </span>
                        }
                        @if (check.cisCode) {
                        <span class="tag-badge text-[11px]
                            bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300">
                            CIS {{ check.cisCode }}
                        </span>
                        }
                        @if (check.pciDssCode) {
                        <span class="tag-badge text-[11px]
                            bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-300">
                            PCI DSS · {{ check.pciDssCode }}
                        </span>
                        }
                        @if (check.result === 'failed') {
                        <span class="tag-badge text-[11px]
                            bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300">
                            No cumple actualmente
                        </span>
                        }
                    </span>
                    }
                </span>
            </label>
            } @empty {
            <p class="text-sm text-gray-500 dark:text-gray-400 py-2">No se encontraron checks.</p>
            }
        </div>
        }
    </div>
    }
</div>

<app-badge-legend [visible]="showLegend" (closed)="closeLegend()" />
