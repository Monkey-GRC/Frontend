<form [formGroup]="templateService.form">
    <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-1 w-full">
            <label>Nombre de la plantilla <span class="text-red-500">*</span></label>
            <ejs-textbox placeholder="Nombre de la plantilla" formControlName="name" floatLabelType="Never"
                cssClass="e-outline shadow-input"></ejs-textbox>
        </div>
        <div class="flex flex-col gap-1 w-full">
            <label>Slug <span class="text-red-500">*</span></label>
            <ejs-textbox placeholder="ej: soc-2" formControlName="slug" floatLabelType="Never"
                cssClass="e-outline shadow-input"></ejs-textbox>
            <span class="text-xs text-gray-500 dark:text-gray-400">Solo minúsculas, números y guiones (ej: "soc-2").</span>
        </div>
        <div class="flex flex-col gap-1">
            <label>Descripción</label>
            <ejs-textarea placeholder="Descripción de la plantilla" formControlName="description" floatLabelType="Never"
                cssClass="e-outline shadow-input"></ejs-textarea>
        </div>
        <div class="flex flex-col gap-1">
            <label>Objetivo</label>
            <ejs-textarea placeholder="Objetivo de la plantilla" formControlName="objective" floatLabelType="Never"
                cssClass="e-outline shadow-input"></ejs-textarea>
        </div>
        <div class="flex flex-col gap-1">
            <label>Alcance</label>
            <ejs-textarea placeholder="Alcance de la plantilla" formControlName="scope" floatLabelType="Never"
                cssClass="e-outline shadow-input"></ejs-textarea>
        </div>
    </div>
</form>
