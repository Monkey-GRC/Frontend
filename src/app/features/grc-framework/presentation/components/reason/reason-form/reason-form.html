<form [formGroup]="reasonService.form">
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1 w-full">
      <label for="name"
        >Nombre de la causa <span class="text-red-500">*</span></label
      >
      <ejs-textbox
        placeholder="Nombre de la causa"
        formControlName="name"
        floatLabelType="Never"
        cssClass="e-outline shadow-input"
      ></ejs-textbox>
    </div>
    <div class="flex flex-col gap-1">
      <label for="description">Descripción de la causa</label>
      <ejs-textarea
        placeholder="Descripción de la causa"
        formControlName="description"
        floatLabelType="Never"
        cssClass="e-outline shadow-input"
      ></ejs-textarea>
    </div>
  </div>
</form>
