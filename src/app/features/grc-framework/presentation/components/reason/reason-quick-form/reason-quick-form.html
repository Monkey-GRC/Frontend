<form [formGroup]="reasonService.form" class="flex flex-col gap-3">
    <div class="flex flex-col gap-1 w-full">
        <label>Nombre de la causa <span class="text-red-500">*</span></label>
        <ejs-textbox placeholder="Nombre de la causa" formControlName="name" floatLabelType="Never"
            cssClass="e-outline shadow-input"></ejs-textbox>
    </div>
    <div class="flex flex-col gap-1">
        <label>Descripción</label>
        <ejs-textarea placeholder="Descripción de la causa" formControlName="description" floatLabelType="Never"
            cssClass="e-outline shadow-input"></ejs-textarea>
    </div>
    <button type="button" (click)="onSubmit()" [disabled]="sendingForm" class="self-start inline-flex items-center gap-1 rounded-lg bg-primary
        px-3 py-1.5 text-sm font-medium text-white hover:bg-primary-500 dark:hover:bg-primary-600 transition-colors duration-200
        disabled:opacity-50">
        Guardar causa
    </button>
</form>
