<div class="relative sm:p-0 bg-white z-1 dark:bg-gray-900">

  <!-- Mobile top bar -->
  <div class="flex lg:hidden items-center justify-center px-4 py-4">
    <div class="flex items-center gap-2">
      <img src="/images/logo/logo-light.svg" alt="Monkey" class="w-80 h-30 dark:hidden" />

      <img src="/images/logo/logo-dark.svg" alt="Monkey" class="w-80 h-30 hidden dark:block" />
    </div>
  </div>

  <div class="relative flex flex-col justify-center w-full h-screen lg:flex-row dark:bg-gray-900 sm:p-0">

    <!-- Selector de idioma: arriba a la derecha de la mitad del formulario, a la vista (no sobre el panel azul) -->
    <div class="absolute top-6 left-0 z-50 flex w-full justify-end px-6 lg:w-1/2">  <app-language-toggle />  </div>

    <!-- Login form -->
    <ng-content></ng-content>

    <!-- Desktop right panel -->
    <div class="items-center hidden w-full h-full lg:w-1/2 bg-primary-500 dark:bg-white/5 lg:grid relative">

      <div class="flex items-center justify-center z-1">

        <!-- Shapes desktop only -->
        <div class="absolute right-0 top-0 -z-1 w-full max-w-[250px] xl:max-w-[450px]">
          <img src="/images/shape/grid-01.svg" alt="grid" />
        </div>

        <div class="absolute bottom-0 left-0 -z-1 w-full max-w-[250px] rotate-180 xl:max-w-[450px]">
          <img src="/images/shape/grid-01.svg" alt="grid" />
        </div>

        <!-- Brand content -->
        <div class="flex flex-col items-center max-w-xs">
          <a routerLink="/" class="block mb-4">
            <img width="190" height="40" src="/images/logo/logo-blanco.svg" alt="Logo" />
          </a>

          <p class="text-center text-gray-400 dark:text-white/60">
            {{ 'AUTH.LAYOUT.TAGLINE' | translate }}
          </p>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- Floating Theme Toggle (mobile + desktop) -->
<div class="fixed bottom-6 right-6 z-9999">
  <app-theme-toggle-two />
</div>
